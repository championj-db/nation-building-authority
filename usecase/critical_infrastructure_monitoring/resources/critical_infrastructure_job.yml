# Job resource for the critical infrastructure monitoring use case.
#
# Runs the synthetic-data generation and analytics pipeline end to end:
# setup -> reference data -> telemetry -> bronze (Auto Loader drain) ->
# silver (identity resolution) -> gold features -> risk scoring and alerts.
#
# Every environment-specific value is a ${var.*} reference - nothing here is
# a literal. Serverless compute: no job_clusters block, no node types, no
# runtime versions to go stale.

resources:
  jobs:
    critical_infrastructure_monitoring_pipeline:
      name: nba-critical-infrastructure-monitoring-${var.environment}

      tags:
        usecase: critical_infrastructure_monitoring
        environment: ${var.environment}

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      max_concurrent_runs: 1

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}

        - task_key: generate_reference_data
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../src/01_generate_reference.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              src_dir: ${workspace.file_path}
              # Seed pins the whole synthetic dataset so every deployment
              # produces the same regulators/operators/assets.
              seed: "42"

        - task_key: generate_telemetry
          depends_on:
            - task_key: generate_reference_data
          notebook_task:
            notebook_path: ../src/02_generate_telemetry.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              src_dir: ${workspace.file_path}
              seed: "42"
              history_days: "14"

        - task_key: bronze_ingest
          depends_on:
            - task_key: generate_telemetry
          notebook_task:
            notebook_path: ../src/03_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              src_dir: ${workspace.file_path}

        - task_key: silver_resolution
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../src/04_silver_resolution.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              src_dir: ${workspace.file_path}
              max_levenshtein: "1"

        - task_key: gold_features
          depends_on:
            - task_key: silver_resolution
          notebook_task:
            notebook_path: ../src/05_gold_features.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              src_dir: ${workspace.file_path}
              feature_window_days: "14"
              recent_days: "3"

        - task_key: risk_scoring_alerts
          depends_on:
            - task_key: gold_features
          notebook_task:
            notebook_path: ../src/06_risk_scoring_alerts.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              src_dir: ${workspace.file_path}
              alert_threshold: "70"

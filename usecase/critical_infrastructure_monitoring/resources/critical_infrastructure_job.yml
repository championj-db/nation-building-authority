# Job resource for the critical infrastructure monitoring use case: a national, cross-sector
# Infrastructure Operations Centre over roads, rail, water and energy.
#
# Runs the synthetic-data generation and analytics pipeline end to end:
# setup -> transport networks (fetched from public sources) -> reference data (assets, sensors,
# dependencies) -> telemetry + hazard warnings ->
# bronze (Auto Loader drain of both feeds) -> silver (conformance and quarantine) ->
# gold features -> risk, incidents and the operating picture.
#
# Every environment-specific value is a ${var.*} reference - nothing here is a literal.
# Serverless compute: no job_clusters block, no node types, no runtime versions to go stale.

resources:
  jobs:
    critical_infrastructure_monitoring_pipeline:
      name: nba-critical-infrastructure-monitoring-${var.environment}

      tags:
        usecase: critical_infrastructure_monitoring
        environment: ${var.environment}

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      max_concurrent_runs: 1

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}

        - task_key: fetch_networks
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../src/01a_fetch_networks.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              src_dir: ${workspace.file_path}

        - task_key: generate_reference_data
          depends_on:
            - task_key: fetch_networks
          notebook_task:
            notebook_path: ../src/01_generate_reference.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              src_dir: ${workspace.file_path}
              # Seed pins the whole synthetic network so every deployment produces the same
              # assets, operators and dependencies.
              seed: "42"
              asset_scale: "6.25"

        - task_key: generate_telemetry
          depends_on:
            - task_key: generate_reference_data
          notebook_task:
            notebook_path: ../src/02_generate_telemetry.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              src_dir: ${workspace.file_path}
              seed: "42"
              history_days: "7"

        - task_key: bronze_ingest
          depends_on:
            - task_key: generate_telemetry
          notebook_task:
            notebook_path: ../src/03_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              src_dir: ${workspace.file_path}

        - task_key: silver_conformance
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../src/04_silver_conformance.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              src_dir: ${workspace.file_path}

        - task_key: gold_features
          depends_on:
            - task_key: silver_conformance
          notebook_task:
            notebook_path: ../src/05_gold_features.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              src_dir: ${workspace.file_path}
              recent_hours: "2"
              baseline_days: "7"

        - task_key: risk_incidents
          depends_on:
            - task_key: gold_features
          notebook_task:
            notebook_path: ../src/06_risk_incidents.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              src_dir: ${workspace.file_path}
              incident_threshold: "52"

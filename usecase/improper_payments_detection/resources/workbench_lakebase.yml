# Investigator workbench - Lakebase (Autoscaling Postgres) resources
#
# Lakebase holds the human side of triage: investigator decisions recorded in the workbench
# (schema ipw, table case_outcome). Step 08 of the pipeline reads them back into Unity Catalog to
# measure precision. Analytical reads (cases, factors, graph, payments) stay in Unity Catalog.
#
# The project's implicit `production` branch, `primary` endpoint and `databricks_postgres`
# database are used. The workbench app's service principal is granted CAN_CONNECT_AND_CREATE
# through its app resource binding and creates its own schema on first start.
#
# No environment-specific value is written as a literal here. See ../../CONTRIBUTING.md.

resources:
  postgres_projects:
    payments_workbench_db:
      project_id: ${var.lakebase_project_id}
      display_name: NBA Payments Workbench (${var.environment})
      pg_version: ${var.lakebase_pg_version}
      default_endpoint_settings:
        autoscaling_limit_min_cu: ${var.lakebase_min_cu}
        autoscaling_limit_max_cu: ${var.lakebase_max_cu}
        suspend_timeout_duration: ${var.lakebase_suspend_timeout}

  postgres_branches:
    payments_workbench_production:
      branch_id: production
      parent: ${resources.postgres_projects.payments_workbench_db.name}
      no_expiry: true
      replace_existing: true

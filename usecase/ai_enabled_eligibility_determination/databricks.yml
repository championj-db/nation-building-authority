# AI-Enabled Eligibility Determination - Benefit Administration
# Modelled on "Citizen 360 and AI-enabled eligibility":
# https://www.databricks.com/solutions/industries/public-sector
#
# No environment-specific value is written as a literal here. See ../../CONTRIBUTING.md.

bundle:
  name: nba-ai-enabled-eligibility-determination

variables:
  catalog:
    description: >-
      Unity Catalog catalog that owns this use case's schemas, volumes and models. Supply via
      --var or .databricks/bundle/<target>/variable-overrides.json so that no environment-specific
      value is committed to this public repository.

  schema:
    description: Schema holding this use case's tables.
    default: ai_enabled_eligibility_determination

  volume:
    description: Unity Catalog volume used to land applications, evidence and policy documents.
    default: landing

  warehouse_id:
    description: >-
      ID of the SQL warehouse the Eligibility Review Workbench queries (on behalf of the signed-in
      user) for governed Unity Catalog reads. Supply via --var or variable-overrides.json.

  app_name:
    description: >-
      Databricks App name (workspace-global, lowercase letters/digits/hyphens, max 30 chars).
      Namespaced per developer in the dev target.
    default: nba-eligibility-workbench

  lakebase_project_id:
    description: >-
      Lakebase (Autoscaling Postgres) project ID backing the workbench's operational state:
      caseworker decisions, review checklists and app-generated audit events.
      Namespaced per developer in the dev target.
    default: nba-eligibility-workbench

  lakebase_pg_version:
    description: Postgres major version for the Lakebase project.
    default: 17

  lakebase_min_cu:
    description: Minimum compute units on the Lakebase primary endpoint.
    default: 0.5

  lakebase_max_cu:
    description: Maximum compute units on the Lakebase primary endpoint.
    default: 2.0

  lakebase_suspend_timeout:
    description: Idle time before the Lakebase endpoint scales to zero.
    default: 300s

  app_schema:
    description: Postgres schema (owned by the app service principal) holding workbench tables.
    default: eligibility_workbench

  model_endpoint:
    description: >-
      Foundation model serving endpoint used by the agentic triage step.
      Defaults to Meta Llama 3.3 70B via Databricks pay-per-token.
    default: databricks-meta-llama-3-3-70b-instruct

  notifications_email:
    description: Address notified when a job run fails.
    default: ${workspace.current_user.userName}

  environment:
    description: Logical environment label, applied as a tag to every resource.
    default: dev

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    # Upload sources into the bundle root (instead of linking to the Git folder) so
    # src/*.py files with a "# Databricks notebook source" header are deployed as notebooks.
    presets:
      source_linked_deployment: false
    variables:
      environment: dev
      schema: ai_enabled_eligibility_determination_${workspace.current_user.short_name}
      app_name: nba-elig-${workspace.current_user.domain_friendly_name}
      lakebase_project_id: nba-elig-${workspace.current_user.domain_friendly_name}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environment: prod

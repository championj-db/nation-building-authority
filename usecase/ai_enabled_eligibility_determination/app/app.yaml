# Eligibility Review Workbench - Databricks App runtime configuration
#
# Every environment-specific value comes from an app resource declared in the bundle
# (resources/eligibility_workbench_app.yml), so nothing here is environment-specific:
#   sql-warehouse  -> warehouse ID for on-behalf-of-user DBSQL reads
#   lakebase       -> Lakebase endpoint for the app's operational store
#   landing-volume -> catalog.schema.volume; the app derives catalog and schema from it
# The bundle's `config` block mirrors this and takes precedence when applied.

command:
  - uvicorn
  - main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LAKEBASE_ENDPOINT
    valueFrom: lakebase
  - name: DATABRICKS_VOLUME
    valueFrom: landing-volume

# Geospatial Analysis - Physical Security
# Pattern-based selection: Databricks SQL spatial functions and H3 indexing. See README.md.
#
# STUB: no resources defined yet. When adding the first resource, create a resources/ directory
# and uncomment the include block below.
#
# No environment-specific value is written as a literal here. See ../../CONTRIBUTING.md.

bundle:
  name: nba-geospatial-analysis

variables:
  catalog:
    description: >-
      Unity Catalog catalog that owns this use case's schemas, volumes and models. Supply via
      --var or .databricks/bundle/<target>/variable-overrides.json so that no environment-specific
      value is committed to this public repository.

  schema:
    description: Schema holding this use case's tables.
    default: geospatial_analysis

  volume:
    description: Unity Catalog volume used to land raw spatial files.
    default: landing

  warehouse_id:
    description: SQL warehouse backing dashboards and SQL tasks.
    default: ""

  notifications_email:
    description: Address notified when a job run fails.
    default: ${workspace.current_user.userName}

  h3_resolution:
    description: >-
      H3 index resolution for spatial indexing and aggregation. Kept as a variable because the
      right resolution depends on the analysis and on privacy constraints, not on the code.
    default: "8"

  environment:
    description: Logical environment label, applied as a tag to every resource.
    default: dev

# include:
#   - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      environment: dev
      schema: geospatial_analysis_${workspace.current_user.short_name}

  prod:
    mode: production
    variables:
      environment: prod

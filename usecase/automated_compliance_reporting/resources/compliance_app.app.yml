resources:
  apps:
    compliance_reporting:
      name: ${var.app_name}
      description: Automated compliance evidence, reporting and audit workspace
      source_code_path: ../app/nba-compliance-reports
      lifecycle:
        started: true
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: report-job
          job:
            id: ${resources.jobs.compliance_report.id}
            permission: CAN_MANAGE_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: overview-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.compliance_overview", permission: SELECT}
        - name: gate-coverage-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.gate_coverage", permission: SELECT}
        - name: coverage-history-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.coverage_history", permission: SELECT}
        - name: attention-view
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.needs_attention", permission: SELECT}
        - name: obligation-view
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.obligation_register_current", permission: SELECT}
        - name: obligation-coverage-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.obligation_coverage", permission: SELECT}
        - name: evidence-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.evidence_inbox", permission: SELECT}
        - name: source-health-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.source_health", permission: SELECT}
        - name: reports-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.compliance_reports", permission: SELECT}
        - name: audit-events-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.audit_events", permission: SELECT}
        - name: audit-verifications-table
          uc_securable: {securable_type: TABLE, securable_full_name: "${var.catalog}.${var.schema}.audit_chain_verifications", permission: SELECT}
      config:
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: DATABRICKS_JOB_ID
            value_from: report-job
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DATABRICKS_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_SCHEMA
            value: ${var.schema}

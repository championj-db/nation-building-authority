# IoT Sensor Data Management - Autonomous Systems
# Telemetry ingest pattern modelled on NHVR scale:
# https://www.databricks.com/customers/national-heavy-vehicle-regulator
#
# STUB: no resources defined yet. When adding the first resource, create a resources/ directory
# and uncomment the include block below.
#
# No environment-specific value is written as a literal here. See ../../CONTRIBUTING.md.

bundle:
  name: nba-iot-sensor-data-management

variables:
  catalog:
    description: >-
      Unity Catalog catalog that owns this use case's schemas, volumes and models. Supply via
      --var or .databricks/bundle/<target>/variable-overrides.json so that no environment-specific
      value is committed to this public repository.

  schema:
    description: Schema holding this use case's tables.
    default: iot_sensor_data_management

  volume:
    description: Unity Catalog volume used to land raw sensor reading files.
    default: landing

  warehouse_id:
    description: SQL warehouse backing dashboards and SQL tasks.
    default: ""

  notifications_email:
    description: Address notified when a job run fails or a sensor goes silent.
    default: ${workspace.current_user.userName}

  watermark_minutes:
    description: >-
      How long to wait for late-arriving readings before closing a window. A variable because the
      right value depends on the estate's connectivity, not on the pipeline code.
    default: "60"

  environment:
    description: Logical environment label, applied as a tag to every resource.
    default: dev

# include:
#   - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      environment: dev
      schema: iot_sensor_data_management_${workspace.current_user.short_name}

  prod:
    mode: production
    variables:
      environment: prod

bundle:
  name: nba-budget-portfolio

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name

resources:
  apps:
    app:
      name: "nba-budget-portfolio"
      description: "National infrastructure budget planning, capacity and variance command centre"
      source_code_path: ./
      user_api_scopes:
        - genie

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: expenditure-fy
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.expenditure_fy", permission: SELECT}
        - name: project-confidence
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.project_confidence", permission: SELECT}
        - name: dim-project
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.dim_project", permission: SELECT}
        - name: capacity-exposure
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.capacity_exposure", permission: SELECT}
        - name: attention-list
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.portfolio_attention_list", permission: SELECT}
        - name: portfolio-kpis
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.portfolio_kpis", permission: SELECT}
        - name: portfolio-capacity
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.portfolio_capacity_fy", permission: SELECT}
        - name: priority-exceptions
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.priority_exceptions", permission: SELECT}
        - name: scenario-summary
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.scenario_summary", permission: SELECT}
        - name: scenario-comparison
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.scenario_comparison", permission: SELECT}
        - name: capacity-demand
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.capacity_demand", permission: SELECT}
        - name: variance-bridge
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.variance_bridge", permission: SELECT}
        - name: assurance-register
          uc_securable: {securable_type: TABLE, securable_full_name: "au_pubsec_catalog.budget_planning_and_projections_jared_champion.assurance_register", permission: SELECT}

targets:
  default:
    default: true
    workspace:
      host: https://fevm-au-pubsec.cloud.databricks.com

    variables:
      sql_warehouse_id: 000000000588d809
      genie_space_id: 01f1ce6cec5d1881987657a5f19d7349
      genie_space_name: Portfolio Genie - budget_planning_and_projections_jared_champion
